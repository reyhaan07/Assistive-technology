<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADAPT-AAC — Development</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="wrap">
    <h1>ADAPT-AAC</h1>
    <p class="mode">DEVELOPMENT / SIMULATION MODE</p>

    <section class="status">
      <div class="row"><span>State</span><b id="state">-</b></div>
      <div class="row"><span>Camera</span><b id="camera">-</b></div>
      <div class="row"><span>Input</span><b id="input">-</b></div>
      <div class="row"><span>Speech</span><b id="speech">-</b></div>
      <div class="row"><span>Candidates</span><b id="candidates">-</b></div>
      <div class="row"><span>Final message</span><b id="final">-</b></div>
    </section>

    <section class="sim">
      <p class="hint">Simulated input (not real ocular detection):</p>
      <div class="buttons">
        <button data-event="BLINK">Blink</button>
        <button data-event="SELECT">Select</button>
        <button data-event="CONFIRM">Confirm</button>
        <button data-event="REJECT">Reject</button>
        <button data-event="CANCEL">Cancel</button>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
